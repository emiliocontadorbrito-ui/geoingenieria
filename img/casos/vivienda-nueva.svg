ke="#1B2024" stroke-width="1.6" stroke-dasharray="6 4"/><rect x="92" y="78" width="140" height="104" fill="#8FB36A" fill-opacity=".55" stroke="#3E5F26" stroke-width="2"/><rect x="72.7" y="49.5" width="178.7" height="21" fill="#3E5F26" stroke="#3E5F26"/><text x="162.0" y="64.0" font-family="Red Hat Text,Archivo,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">construcción nueva · 146 m²</text><rect width="330" height="270" fill="none" stroke="#1B2024"/></g></svg>