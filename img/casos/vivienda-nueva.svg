<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img"><title>Vivienda nueva en una parcela que el Catastro tiene como solar</title><defs>
<pattern id="teja" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#9A8F84"/><rect y="4" width="6" height="2" fill="#8A8077"/></pattern>
<pattern id="teja-nueva" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#B86A4B"/><rect y="4" width="6" height="2" fill="#A65D41"/></pattern>
<pattern id="chapa" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#CDD1D3"/><rect width="1.2" height="5" fill="#B9BEC1"/></pattern>
<pattern id="patio" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#D8D0BF"/><rect width="4" height="4" fill="#D2C9B7"/></pattern>
